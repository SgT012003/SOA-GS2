name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-security:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Verify Dependencies
        run: go mod download

      - name: Run Unit & E2E Tests
        run: go test ./... -v

      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: ./...
